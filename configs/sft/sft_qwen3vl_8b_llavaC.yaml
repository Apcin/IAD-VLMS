### Paths below use ${WORK_DIR} (the workspace holding LlamaFactory/, outputs/, hf_cache/)
### and ${REPO_ROOT} (this repository). The launcher in scripts/01_sft/ expands them into a
### temp copy before calling llamafactory-cli.
### CORPUS-TRANSFER TEST. Qwen3-VL-8B-Instruct SFT on the LLaVA-derived KCR Arm-C corpus.
### This file is sft_qwen3vl_8b_armC.yaml with two lines changed, dataset and output_dir.
### The Arm C header below is left in place on purpose so the diff stays two lines.
### Corpus: datasets_sft_llava_iter1/sft_llava_C_train.json, 6,000 items, 3,000 NG / 3,000 OK
### by source folder. Distilled from LLaVA-OneVision-7B-SI's own rollouts, not from Qwen's.
### Verdict balance is 2,703 yes / 3,297 no, because 297 NG-folder captures carry gt_answer=no
### in phase0_llava_10k_20260901/rollouts_raw.jsonl and their traces answer no. Checked, not assumed.
### Reference run on the Qwen-derived corpus: 752 steps, 21,157 s, DS/VisA 82.62/77.67 at ep1.
### NOT FOR THE THESIS. Post-upload artefact.
### Qwen3-VL-8B-Instruct SFT on Arm-C 6K (kept + corrected + rewritten; STaR + Saunders critique-and-revise).
### Backbone-independence test (thesis Limitation L4) vs the Qwen2.5-VL-7B Arm-C run (82.80/72.07).
### From base, 4 epochs, frozen ViT, DeepSpeed ZeRO-3 CPU offload, save_only_model (no optimizer state saved).
### Mirrors configs/sft/sft_abc_C.yaml exactly except: model, template=qwen3_vl, output dir, and batch (4x4 to be safe on 8B).
model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
image_max_pixels: 262144
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false
freeze_language_model: false

### deepspeed
deepspeed: ${REPO_ROOT}/configs/deepspeed/ds_z3_cpu_offload.json

### dataset
dataset: iad_sft_llava_iter1_C
template: qwen3_vl
cutoff_len: 12144
preprocessing_num_workers: 4

### output
output_dir: ${WORK_DIR}/outputs/sft_qwen3vl_8b_llavaC
logging_steps: 10
save_strategy: epoch
save_total_limit: 4
save_only_model: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
num_train_epochs: 4
learning_rate: 1.0e-5
lr_scheduler_type: cosine
warmup_steps: 20
bf16: true
ddp_timeout: 180000000
gradient_checkpointing: true
