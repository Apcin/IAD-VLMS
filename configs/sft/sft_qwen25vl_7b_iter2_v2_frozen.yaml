### model
# v1 paper Table 5: SFT-Iter(i) re-initializes from the BASE model.
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 262144
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false
freeze_language_model: false

### deepspeed
deepspeed: /bulk/aacudad/reasoning_traces/Training/ds_z3_cpu_offload.json

### dataset
# Rollout-and-filter output from grpo_run2/ckpt-530 over the SFT 6k pool,
# with user message in SFT-Iter1 format (make_train_prompt per product).
dataset: iad_sft_iter2_v2_train
template: qwen2_vl
cutoff_len: 12144
preprocessing_num_workers: 4

### output
output_dir: /bulk/aacudad/reasoning_traces/outputs/sft_qwen25vl_7b_iter2_v2_frozen
logging_steps: 10
save_strategy: epoch
save_total_limit: 5
save_only_model: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
num_train_epochs: 4
learning_rate: 1.0e-5
lr_scheduler_type: cosine
warmup_steps: 20
bf16: true
ddp_timeout: 180000000
gradient_checkpointing: true
