### MMAD leak side-experiment: SFT on 1,600 MMAD images (Gemini 3.6-Flash traces, v4 recipe with MMAD hints).
### Identical recipe to the thesis 6K frozen SFT (sft_abc_C.yaml): from base, 4 epochs, frozen ViT, Z3 offload.
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 262144
trust_remote_code: true
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false
freeze_language_model: false
deepspeed: ${WORK_DIR}/Training/ds_z3_cpu_offload.json
dataset: mmad_sft_train1600
template: qwen2_vl
cutoff_len: 12144
preprocessing_num_workers: 4
output_dir: ${WORK_DIR}/outputs/sft_qwen25vl_7b_mmad_train1600
logging_steps: 10
save_strategy: epoch
save_total_limit: 4
save_only_model: true
overwrite_output_dir: true
report_to: none
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
num_train_epochs: 4
learning_rate: 1.0e-5
lr_scheduler_type: cosine
warmup_steps: 20
bf16: true
ddp_timeout: 180000000
gradient_checkpointing: true
