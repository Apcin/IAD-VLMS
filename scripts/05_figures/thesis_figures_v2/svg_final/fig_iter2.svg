x="128.0" y="311.0" class="t13 e">transistor</text><rect x="202.9" y="300.0" width="61.1" height="15.0" fill="#d9363e" rx="2"/><text x="448.0" y="312.0" class="t13 b e" style="fill:#d9363e">-3.3</text><text x="128.0" y="335.0" class="t13 e">zipper</text><rect x="246.4" y="324.0" width="17.6" height="15.0" fill="#d9363e" rx="2"/><text x="448.0" y="336.0" class="t13 e" style="fill:#d9363e">-1.0</text><text x="128.0" y="359.0" class="t13 e">carpet</text><rect x="251.7" y="348.0" width="12.3" height="15.0" fill="#d9363e" rx="2"/><text x="448.0" y="360.0" class="t13 e" style="fill:#d9363e">-0.7</text><text x="128.0" y="383.0" class="t13 e">leather</text><rect x="264.0" y="372.0" width="1.2" height="15.0" fill="#5b6770" rx="2"/><text x="448.0" y="384.0" class="t13 e" style="fill:#5b6770">+0.0</text><text x="128.0" y="407.0" class="t13 e">pill</text><rect x="264.0" y="396.0" width="1.2" height="15.0" fill="#5b6770" rx="2"/><text x="448.0" y="408.0" class="t13 e" style="fill:#5b6770">+0.0</text><text x="128.0" y="431.0" class="t13 e">screw</text><rect x="264.0" y="420.0" width="21.6" height="15.0" fill="#00b95c" rx="2"/><text x="448.0" y="432.0" class="t13 e" style="fill:#00b95c">+1.2</text><text x="128.0" y="455.0" class="t13 e">tile</text><rect x="264.0" y="444.0" width="21.8" height="15.0" fill="#00b95c" rx="2"/><text x="448.0" y="456.0" class="t13 e" style="fill:#00b95c">+1.2</text><text x="128.0" y="479.0" class="t13 e">grid</text><rect x="264.0" y="468.0" width="32.0" height="15.0" fill="#00b95c" rx="2"/><text x="448.0" y="480.0" class="t13 e" style="fill:#00b95c">+1.8</text><text x="128.0" y="503.0" class="t13 e">cable</text><rect x="264.0" y="492.0" width="43.9" height="15.0" fill="#00b95c" rx="2"/><text x="448.0" y="504.0" class="t13 e" style="fill:#00b95c">+2.4</text><text x="128.0" y="527.0" class="t13 e">toothbrush</text><rect x="264.0" y="516.0" width="106.8" height="15.0" fill="#00b95c" rx="2"/><text x="448.0" y="528.0" class="t13 b e" style="fill:#00b95c">+5.8</text><line x1="40.0" y1="544.0" x2="448.0" y2="544.0" stroke="#8d979e" stroke-width="1"/><text x="128.0" y="566.0" class="t13 b e">all products</text><rect x="233.6" y="556.0" width="30.4" height="15.0" fill="#d9363e" rx="2"/><text x="448.0" y="568.0" class="t15 b e" style="fill:#d9363e">-1.66</text><rect x="532.0" y="100.0" width="440.0" height="560.0" fill="#fff" stroke="#8d979e" stroke-width="2" rx="26"/><text x="550.0" y="136.0" class="t18 b">Why</text><rect x="554.0" y="166.0" width="396.0" height="96.0" fill="#d4e9d4" rx="10"/><text x="570.0" y="194.0" class="t16 b">Kept items</text><text x="570.0" y="218.0" class="t13">3,557 of the model's own rollouts</text><text x="570.0" y="240.0" class="t13 b" style="fill:#3a7d3a">near-zero loss, almost no gradient</text><rect x="554.0" y="272.0" width="396.0" height="96.0" fill="#fde3c0" rx="10"/><text x="570.0" y="300.0" class="t16 b">Patched items</text><text x="570.0" y="324.0" class="t13">2,443 teacher-written traces</text><text x="570.0" y="346.0" class="t13 b" style="fill:#8a5b00">94.8 % anomalous, high loss</text><rect x="554.0" y="378.0" width="396.0" height="96.0" fill="#e3e7ea" rx="10"/><text x="570.0" y="406.0" class="t16 b">Net effect</text><text x="570.0" y="430.0" class="t13">the corpus is balanced 50/50</text><text x="570.0" y="452.0" class="t13 b" style="fill:#d9363e">the gradient is about 95 % anomalous</text><text x="554.0" y="494.0" class="t15">Anomaly recall therefore rises each epoch while</text><text x="554.0" y="516.0" class="t15">normal recall falls. Every regression above is on a</text><text x="554.0" y="538.0" class="t15">product whose normal class is subtle.</text><rect x="554.0" y="554.0" width="396.0" height="68.0" fill="#d4e9d4" rx="10"/><text x="570.0" y="580.0" class="t15 b">The same corpus trained from base</text><text x="570.0" y="604.0" class="t15 b" style="fill:#3a7d3a">reaches 82.80 %, the best model in this thesis.</text></svg>